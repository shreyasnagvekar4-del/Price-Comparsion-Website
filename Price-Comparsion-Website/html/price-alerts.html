<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Price Alerts - Price Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: url('../images/login.jpg') no-repeat center;
            background-size: cover;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border: none;
            border-radius: 50%;
            transition: background-color 0.3s;
            flex-shrink: 0;
        }

            .back-btn:hover {
                background-color: rgba(0, 85, 255, 0.1);
            }

            .back-btn svg {
                width: 24px;
                height: 24px;
            }

        .logo {
            display: flex;
            align-items: center;
        }

            .logo img {
                width: 40px;
                margin-right: 10px;
            }

        .logo-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4285f4;
            text-transform: uppercase;
            letter-spacing: -0.4px;
            user-select: none;
            margin: 0;
            line-height: 1.1;
            font-weight: 700;
            font-size: 24px;
            text-align: left;
        }


        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .alerts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .alert-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: transform .2s;
        }

            .alert-card:hover {
                transform: translateY(-5px);
            }

        .alert-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .alert-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .alert-desc {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }

        .alert-price {
            margin: 6px 0;
            color: #333;
        }

        .target {
            color: #0055ff;
            font-weight: bold;
        }

        .remove-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 20px;
            background: #ff5252;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .empty-msg {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <header class="header">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M15 18L9 12L15 6"
                      stroke="#0055ff"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round" />
            </svg>
        </button>

        <div class="logo">
            <img src="../images/logo.png.png">
            <div class="logo-text">PRICE<br>COMPARISON</div>
        </div>
    </header>

    <div class="container">
        <h2>My Price Alerts</h2>

        <div class="alerts-grid" id="alerts"></div>

        <p class="empty-msg" id="empty-msg" style="display:none;">
            You have no price alerts yet.
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmNVvciSiEQHEk_RyEZIsTRcdQtAzDMJk",
            authDomain: "price-comparison-website-7274d.firebaseapp.com",
            projectId: "price-comparison-website-7274d",
            databaseURL: "https://price-comparison-website-7274d-default-rtdb.asia-southeast1.firebasedatabase.app/",
            storageBucket: "price-comparison-website-7274d.appspot.com",
            messagingSenderId: "394357508099",
            appId: "1:394357508099:web:1d37bda0aff88d85002636",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const userId = localStorage.getItem("userId") || "guest";
        const userEmail = localStorage.getItem("email");

        const alertsGrid = document.getElementById("alerts");
        const emptyMsg = document.getElementById("empty-msg");

        function loadAlerts() {
            get(ref(db, `priceAlerts/${userId}`)).then(snapshot => {

                if (!snapshot.exists()) {
                    emptyMsg.style.display = "block";
                    return;
                }

                const data = snapshot.val();
                alertsGrid.innerHTML = "";
                emptyMsg.style.display = "none";

                Object.entries(data).forEach(([key, alert]) => {

                    if (!alert.email && userEmail) {
                        update(ref(db, `priceAlerts/${userId}/${key}`), {
                            email: userEmail
                        });
                        alert.email = userEmail;
                    }

                    const card = document.createElement("div");
                    card.className = "alert-card";
                    card.setAttribute("data-id", key); // ✅ added

                    card.innerHTML = `
                            <img class="alert-image" src="${alert.image}">
                            <div class="alert-name">${alert.name}</div>
                            <div class="alert-desc">${alert.description || ""}</div>
                            <div class="alert-price">Current Price: ₹${Number(alert.currentPrice).toLocaleString("en-IN")}</div>
                            <div class="alert-price target">Target Price: ₹${Number(alert.targetPrice).toLocaleString("en-IN")}</div>
                            <button class="remove-btn" onclick="removeAlert('${key}')">Remove Alert</button>
                        `;

                    alertsGrid.appendChild(card);
                });
            });
        }

        window.removeAlert = function (productId) {

            // ✅ instant UI remove
            const card = document.querySelector(`[data-id="${productId}"]`);

            if (card) {
                card.style.transition = "0.25s";
                card.style.opacity = "0";
                card.style.transform = "scale(0.9)";

                setTimeout(() => {
                    card.remove();

                    // ✅ show empty message if no cards left
                    if (alertsGrid.children.length === 0) {
                        emptyMsg.style.display = "block";
                    }

                }, 250);
            }

            // ✅ remove from DB
            remove(ref(db, `priceAlerts/${userId}/${productId}`))
                .catch(err => console.error(err));
        };

        loadAlerts();
    </script>

</body>
</html>
