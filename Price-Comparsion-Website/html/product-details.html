<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Details - Price Comparison</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: url('../images/login.jpg') no-repeat center;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            backdrop-filter: blur(6px);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border: none;
            border-radius: 50%;
            transition: background-color 0.3s;
            flex-shrink: 0;
        }

            .back-btn:hover {
                background-color: rgba(0, 85, 255, 0.1);
            }

            .back-btn svg {
                width: 24px;
                height: 24px;
            }

        .logo {
            display: flex;
            align-items: center;
        }

            .logo img {
                width: 42px;
                height: 42px;
                margin-right: 10px;
            }

        .logo-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4285f4;
            text-transform: uppercase;
            letter-spacing: -0.4px;
            user-select: none;
            margin: 0;
            line-height: 1.1;
            font-weight: 700;
            font-size: 24px;
            text-align: left;
        }


        .page-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255,255,255,0.96);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            backdrop-filter: blur(10px);
        }

        .product-image {
            text-align: center;
        }

            .product-image img {
                width: 100%;
                max-width: 420px;
                object-fit: contain;
            }

        .product-info h2 {
            margin-top: 0;
            color: #222;
            font-size: 28px;
        }

        .description {
            margin: 15px 0;
            color: #555;
            line-height: 1.6;
        }

        .specs h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .specs ul {
            list-style: none;
            padding: 0;
        }

        .specs li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #b12704;
        }

        .price-section {
            display: flex;
            gap: 15px;
            margin: 25px 0;
        }

        .price-item {
            flex: 1;
            text-align: center;
            padding: 18px;
            border-radius: 12px;
            background: linear-gradient(135deg,#f7f7f7,#ffffff);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            width: calc(50% - 6px);
        }

        .compare {
            background: #ff9800;
            color: white;
        }

        .save {
            background: #4caf50;
            color: white;
        }

        .remove {
            background: #ff5252;
            color: white;
        }

        .alert {
            background: #0055ff;
            color: white;
        }

        .amazon {
            background: #232f3e;
            color: white;
        }

        .flipkart {
            background: #2874f0;
            color: white;
        }

        .last-updated {
            font-size: 14px;
            color: #777;
            margin-top: 18px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 25px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <button id="back-btn" class="back-btn" >
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M15 18L9 12L15 6"
                      stroke="#0055ff"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round" />
            </svg>
        </button>

        <div class="logo">
            <img src="../images/logo.png.png" />
            <div class="logo-text">PRICE<br>COMPARISON</div>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="container" id="product">

            <div class="product-image">
                <img id="product-img" src="" alt="Product Image">
            </div>

            <div class="product-info">
                <h2 id="product-name">Loading...</h2>
                <div class="description" id="product-description"></div>
                <div class="specs" id="product-specs"></div>

                <div class="price-section">
                    <div class="price-item" id="amazon-price-item" style="display: none;">
                        <p>Amazon Price</p>
                        <div class="price" id="amazon-price"></div>
                    </div>
                    <div class="price-item" id="flipkart-price-item" style="display: none;">
                        <p>Flipkart Price</p>
                        <div class="price" id="flipkart-price"></div>
                    </div>
                </div>

                <div class="buttons">
                    <button class="compare" id="compare-btn">Compare Best Price</button>
                    <button class="save" id="save-btn">Save Product</button>
                    <button class="alert" id="alert-btn">Set Price Alert</button>
                    <button class="amazon" id="amazon-btn" style="display:none;">Buy on Amazon</button>
                    <button class="flipkart" id="flipkart-btn" style="display:none;">Buy on Flipkart</button>
                </div>

                <p class="last-updated" id="last-updated"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmNVvciSiEQHEk_RyEZIsTRcdQtAzDMJk",
            authDomain: "price-comparison-website-7274d.firebaseapp.com",
            projectId: "price-comparison-website-7274d",
            databaseURL: "https://price-comparison-website-7274d-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const id = new URLSearchParams(window.location.search).get("id");
        let productData = null;

        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                localStorage.setItem("userId", user.uid);
            } else {
                alert("Please login again");
            }
        });

        const categories = ["products", "smartphones", "laptop", "tablets", "tv", "headphones"];

        /* -------- Load Product -------- */
        async function loadProduct() {
            for (let category of categories) {
                const snapshot = await get(ref(db, `${category}/${id}`));

                if (snapshot.exists()) {
                    productData = snapshot.val();

                    document.getElementById("product-img").src = productData.image || "";
                    document.getElementById("product-name").textContent = productData.name || "";
                    document.getElementById("product-description").innerHTML = productData.description || "";

                    document.getElementById("product-specs").innerHTML =
                        `<h3>Specifications</h3>
                        <ul>${Object.entries(productData.specs || {})
                            .map(([k, v]) => `<li><strong>${k}:</strong> ${v}</li>`)
                            .join("")}</ul>`;

                    document.getElementById("amazon-price").textContent =
                        productData?.amazon?.price ?
                            `₹${Number(productData.amazon.price).toLocaleString("en-IN")}` : "N/A";

                    document.getElementById("flipkart-price").textContent =
                        productData?.flipkart?.price ?
                            `₹${Number(productData.flipkart.price).toLocaleString("en-IN")}` : "N/A";

                    document.getElementById("last-updated").textContent =
                        `Last updated: ${productData.lastUpdated || "N/A"}`;

                    updateSaveButton();
                    return;
                }
            }

            alert("Product not found");
        }

        loadProduct();

        /* -------- Save -------- */

        function isSaved() {
            const saved = JSON.parse(localStorage.getItem("savedProducts") || "[]");
            return saved.some(p => p.id === id);
        }

        function updateSaveButton() {
            const btn = document.getElementById("save-btn");

            if (isSaved()) {
                btn.textContent = "Remove from Saved";
                btn.classList.remove("save");
                btn.classList.add("remove");
            } else {
                btn.textContent = "Save Product";
                btn.classList.remove("remove");
                btn.classList.add("save");
            }
        }

        function toggleSaveProduct() {
            if (!productData) return;

            let saved = JSON.parse(localStorage.getItem("savedProducts") || "[]");

            if (isSaved()) {
                saved = saved.filter(p => p.id !== id);
                alert("Removed from saved");
            } else {
                saved.push({ id, ...productData });
                alert("Product saved");
            }

            localStorage.setItem("savedProducts", JSON.stringify(saved));
            updateSaveButton();
        }

        /* -------- Compare -------- */

        function comparePrice() {
            if (!productData) return;

            const amazonPrice = Number(productData?.amazon?.price || 0);
            const flipkartPrice = Number(productData?.flipkart?.price || 0);

            const amazonBtn = document.getElementById("amazon-btn");
            const flipkartBtn = document.getElementById("flipkart-btn");

            document.getElementById("amazon-price-item").style.display = "block";
            document.getElementById("flipkart-price-item").style.display = "block";

            if (amazonPrice && flipkartPrice) {
                if (amazonPrice < flipkartPrice) {
                    amazonBtn.style.display = "inline-block";
                    flipkartBtn.style.display = "none";
                    alert(`Amazon is cheaper by ₹${flipkartPrice - amazonPrice}`);
                } else if (flipkartPrice < amazonPrice) {
                    flipkartBtn.style.display = "inline-block";
                    amazonBtn.style.display = "none";
                    alert(`Flipkart is cheaper by ₹${amazonPrice - flipkartPrice}`);
                } else {
                    amazonBtn.style.display = "inline-block";
                    flipkartBtn.style.display = "inline-block";
                    alert("Prices are the same!");
                }
            }
        }

        /* -------- Price Alert (ONLY FIXED PART) -------- */

        function setPriceAlert() {
            if (!productData) return;

            const target = prompt("Notify me when price goes below:");

            if (!target || isNaN(target)) {
                alert("Enter valid price");
                return;
            }

            const userId = localStorage.getItem("userId");

            if (!userId) {
                alert("User not logged in properly. Please login again.");
                return;
            }

            // ✅ FIX: use async handling properly
            get(ref(db, `users/${userId}/email`))
                .then(snapshot => {

                    if (!snapshot.exists()) {
                        alert("Email not found. Please login again.");
                        return;
                    }

                    const email = snapshot.val();

                    const currentPrice = Math.min(
                        Number(productData?.amazon?.price || Infinity),
                        Number(productData?.flipkart?.price || Infinity)
                    );

                    return set(ref(db, `priceAlerts/${userId}/${id}`), {
                        productId: id,
                        name: productData.name,
                        image: productData.image,
                        targetPrice: Number(target),
                        currentPrice: currentPrice,
                        createdAt: new Date().toISOString(),
                        email: email
                    });
                })
                .then(() => {
                    alert("Price alert set!");
                })
                .catch(err => {
                    console.error("ERROR:", err);
                    alert("Something went wrong. Check console.");
                });
        }

        /* -------- Buttons -------- */

        document.getElementById("back-btn").onclick = () => history.back();
        document.getElementById("compare-btn").onclick = comparePrice;
        document.getElementById("save-btn").onclick = toggleSaveProduct;
        document.getElementById("alert-btn").onclick = setPriceAlert;

        document.getElementById("amazon-btn").onclick = () => {
            if (productData?.amazon?.url)
                window.open(productData.amazon.url, "_blank");
        };

        document.getElementById("flipkart-btn").onclick = () => {
            if (productData?.flipkart?.url)
                window.open(productData.flipkart.url, "_blank");
        };
    </script>



</body>
</html>
