<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/StyleSheet3.css" />  <!-- Same CSS as login page -->
    <script src="../js/JavaScript2.js" defer type="module"></script>

</head>
<body>

    <div class="wrapper" role="main" aria-label="Dashboard">
        <div class="logo-container" aria-label="Price Comparison Logo">
            <img src="../images/logo.png.png" alt="" class="icon" aria-hidden="true" />  <!-- Fixed: Removed extra .png -->
            <h1 class="logo-text">
                <span class="price-text">PRICE</span><br />
                <span class="comparison-text">COMPARISON</span>
            </h1>
        </div>

        <h2>Welcome</h2>

        <!-- User info section -->
        <div id="user-info" style="text-align: center; margin-top: 20px;">
            <img id="user-photo" src="" alt="User Photo" style="width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px;" />
            <h2 id="welcome-message"></h2>
        </div>

        <!-- Next button (styled like login button) -->
        <button type="button" id="next-btn" class="google-login-btn" aria-label="Next">
            Next →
        </button>
    </div>

    
        
</body>
</html>
