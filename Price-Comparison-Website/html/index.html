<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../js/JavaScript.js" defer type="module"></script>
    <title>Login form</title>
    <link rel="stylesheet" href="../css/StyleSheet3.css" />
</head>
<body>
    <div class="wrapper" role="main" aria-label="Login Form">
        <div class="logo-container" aria-label="Price Comparison Logo">
            <img src="../images/logo.png.png" alt="Price Comparison logo icon" class="icon" aria-hidden="true" />
            <h1 class="logo-text">
                <span class="price-text">PRICE</span><br />
                <span class="comparison-text">COMPARISON</span>
            </h1>
        </div>

        <h2>Login</h2>

        <form>
            <button type="button" id="google-login-btn" class="google-login-btn" aria-label="Login with Google">
                <img src="../images/google.png" alt="Google logo" class="google-logo" aria-hidden="true" />
                Login with Google
            </button>
        </form>
    </div>
</body>
</html>
